# MCP Knot 开发环境 Docker Compose 配置

version: '3.8'

services:
  # API 服务器开发模式
  mcp-knot-api-dev:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: base
    container_name: mcp-knot-api-dev
    ports:
      - '8181:8181'
    environment:
      - NODE_ENV=development
      - PORT=8181
    volumes:
      # 挂载源代码用于热重载
      - ./packages/share:/app/packages/share
      - ./packages/core:/app/packages/core
      - ./backend:/app/backend
      - ./backend/config:/app/backend/config
      - ./logs:/app/logs
    command: ['pnpm', 'dev:api']
    restart: unless-stopped
    networks:
      - mcp-knot-dev-network

  # 前端开发服务器
  mcp-knot-web-dev:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: base
    container_name: mcp-knot-web-dev
    ports:
      - '8180:8180'
    environment:
      - VITE_API_BASE_URL=http://localhost:8181
    volumes:
      # 挂载源代码用于热重载
      - ./frontend:/app/frontend
    command: ['pnpm', 'dev:fe']
    restart: unless-stopped
    networks:
      - mcp-knot-dev-network

networks:
  mcp-knot-dev-network:
    driver: bridge
