name: Publish Packages

on:
  push:
    branches:
      - main
  # 当 Version Packages PR 标题为 "chore: version packages" 时触发
  pull_request:
    branches:
      - main
    types: [closed]

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8'

jobs:
  # 发布到 npm
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # 只在 PR 关闭且标题匹配时运行
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.pull_request.merged == true &&
      contains(github.head_commit.message, 'chore: version packages')
    outputs:
      published: ${{ steps.publish.outputs.published }}
      publishedPackages: ${{ steps.publish.outputs.publishedPackages }}
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 发布到 npm
        id: publish
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # 创建 GitHub Release
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: needs.publish.outputs.published == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## Changes in this Release

            For detailed changes, please check the individual package CHANGELOGs.

            ### Published Packages
            ${{ needs.publish.outputs.publishedPackages }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 发布 Docker 镜像
  docker-publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: publish
    if: needs.publish.outputs.published == 'true'
    strategy:
      matrix:
        image:
          - name: api
            dockerfile: backend/Dockerfile
            context: .
          - name: web
            dockerfile: frontend/Dockerfile
            context: .
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 获取版本号
        id: get_version
        run: |
          if [ "${{ matrix.image.name }}" == "api" ]; then
            VERSION=$(node -p "require('./backend/package.json').version")
          else
            VERSION=$(node -p "require('./frontend/package.json').version")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: |
            mcp-hub/${{ matrix.image.name }}:latest
            mcp-hub/${{ matrix.image.name }}:${{ steps.get_version.outputs.VERSION }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
