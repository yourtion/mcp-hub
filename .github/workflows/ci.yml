name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '9'

jobs:
  # 代码质量检查
  lint-and-format:
    name: 代码质量检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 获取 pnpm store 目录
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: 设置 pnpm 缓存
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 代码格式检查
        run: pnpm check:all

  # 单元测试
  test:
    name: 单元测试 (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint-and-format
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 获取 pnpm store 目录
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: 设置 pnpm 缓存
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建项目
        run: pnpm build

      - name: 运行单元测试
        run: pnpm ci:test

      - name: 生成覆盖率报告
        if: matrix.node-version == '24.x'
        run: pnpm coverage:merge && pnpm coverage:report

      - name: 上传覆盖率报告到 Codecov
        uses: codecov/codecov-action@v5
        if: matrix.node-version == '24.x'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: yourtion/mcp-hub
          files: |
            ./backend/coverage/lcov.info
            ./packages/core/coverage/lcov.info
            ./packages/cli/coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
          verbose: true

      - name: 上传覆盖率报告作为构建产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports-${{ matrix.node-version }}
          path: |
            ./coverage/
            ./backend/coverage/
            ./packages/core/coverage/
            ./packages/cli/coverage/
          retention-days: 30

      - name: 评论 PR 覆盖率报告
        if: github.event_name == 'pull_request' && matrix.node-version == '24.x'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // 读取各包的覆盖率报告
            const packages = [
              { name: 'Backend API', path: './backend/coverage/coverage-summary.json', threshold: 80 },
              { name: 'Core Package', path: './packages/core/coverage/coverage-summary.json', threshold: 85 },
              { name: 'CLI Package', path: './packages/cli/coverage/coverage-summary.json', threshold: 85 }
            ];

            let comment = '## 📊 测试覆盖率报告\n\n';

            for (const pkg of packages) {
              if (fs.existsSync(pkg.path)) {
                try {
                  const summary = JSON.parse(fs.readFileSync(pkg.path, 'utf8'));
                  const { total } = summary;

                  comment += `### ${pkg.name}\n\n`;
                  comment += '| 指标 | 覆盖率 | 阈值 | 状态 |\n';
                  comment += '|------|--------|------|------|\n';
                  comment += `| 行覆盖率 | ${total.lines.pct.toFixed(2)}% | ${pkg.threshold}% | ${total.lines.pct >= pkg.threshold ? '✅' : '❌'} |\n`;
                  comment += `| 函数覆盖率 | ${total.functions.pct.toFixed(2)}% | ${pkg.threshold}% | ${total.functions.pct >= pkg.threshold ? '✅' : '❌'} |\n`;
                  comment += `| 语句覆盖率 | ${total.statements.pct.toFixed(2)}% | ${pkg.threshold}% | ${total.statements.pct >= pkg.threshold ? '✅' : '❌'} |\n`;
                  comment += `| 分支覆盖率 | ${total.branches.pct.toFixed(2)}% | ${pkg.threshold}% | ${total.branches.pct >= pkg.threshold ? '✅' : '❌'} |\n\n`;
                } catch (error) {
                  comment += `### ${pkg.name}\n❌ 无法读取覆盖率报告\n\n`;
                }
              } else {
                comment += `### ${pkg.name}\n⚠️ 覆盖率报告不存在\n\n`;
              }
            }

            comment += '💡 **提示**: 查看详细报告请下载构建产物中的 HTML 报告。\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # 构建测试
  build:
    name: 构建测试
    runs-on: ubuntu-latest
    needs: lint-and-format
    timeout-minutes: 20
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 获取 pnpm store 目录
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: 设置 pnpm 缓存
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建所有包
        run: pnpm build:production

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            packages/core/dist/
            packages/cli/dist/
            backend/dist/
            frontend/dist/
          retention-days: 7

  # 端到端测试
  e2e-test:
    name: 端到端测试
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 获取 pnpm store 目录
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: 设置 pnpm 缓存
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: 运行端到端测试
        run: pnpm test:e2e

  # Docker 构建测试
  docker-build:
    name: Docker 构建测试
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    timeout-minutes: 30
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建 API 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: mcp-hub/api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建 CLI 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/cli/Dockerfile
          push: false
          tags: mcp-hub/cli:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建前端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: mcp-hub/web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Changesets - 仅创建 Version Packages PR
  changesets:
    name: Changesets Version Management
    runs-on: ubuntu-latest
    needs: [test, build, e2e-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 创建 Version Packages Pull Request
        uses: changesets/action@v1
        with:
          # 不设置 publish，只创建 PR
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
